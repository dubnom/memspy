type: sections
max_columns: 4
title: MemSpy
path: memspy
sections:
  - type: grid
    cards:
      - type: heading
        heading_style: title
        heading: Memory Usage
      - type: gauge
        entity: sensor.memory_use_percent
        name: ''
        grid_options:
          columns: 6
          rows: auto
      - type: statistics-graph
        grid_options:
          columns: 6
          rows: auto
        entities:
          - entity: sensor.memory_use_percent
            name: Memory
        title: 2 Days
        days_to_show: 2
        period: hour
        chart_type: line
        stat_types:
          - mean
          - max
          - min
        hide_legend: true
      - type: custom:apexcharts-card
        header:
          show: true
          title: Memory Comparison
          show_states: true
          colorize_states: true
        yaxis:
          - decimals: 0
            align_to: 0.1
        graph_span: 4h
        series:
          - entity: sensor.memory_use_percent
            transform: return x * 2**24 * .00000001;
            unit: gb
            stroke_width: 2
            float_precision: 1
            name: System
          - entity: sensor.memspy_class_001
            transform: return x * .000000001;
            unit: gb
            stroke_width: 2
            float_precision: 1
          - entity: sensor.memspy_class_002
            transform: return x * .000000001;
            unit: gb
            stroke_width: 2
            float_precision: 1
          - entity: sensor.memspy_class_003
            transform: return x * .000000001;
            unit: gb
            stroke_width: 2
            float_precision: 1
  - type: grid
    cards:
      - type: heading
        heading_style: title
        heading: TraceMalloc
      - type: tile
        entity: switch.memspy_memspy_tracemalloc_active
        name: Tracing
        state_content: last_changed
        vertical: false
        features:
          - type: toggle
        features_position: bottom
      - type: custom:mushroom-select-card
        entity: select.memspy_memspy_memspy_tracemalloc_include
        name: Integrations to Include
        grid_options:
          columns: 6
          rows: 2
      - type: tile
        grid_options:
          columns: 12
          rows: 1
        entity: text.memspy_memspy_tracemalloc_exclude
        name: Exclude
        vertical: false
        features_position: bottom
      - type: markdown
        content: >-
          {% set duration =
          states('sensor.memspy_memspy_tracemalloc_duration') %}

          {% if duration != 'unknown' -%}

          {% set seconds = duration | int %} {% set hours = seconds // 3600
          %} {% set minutes = (seconds % 3600) // 65 %} {% set secs =
          seconds % 60 %}

          # Results

          Duration <b>{{ '%02d:%02d:%02d' | format(hours, minutes, secs) }}

          </b> Computed {{
          time_since(states.sensor.memspy_memspy_tracemalloc.last_updated)
          }} ago

          {% set snapshot = state_attr( 'sensor.memspy_memspy_tracemalloc',
          'snapshot' ) | from_json %}

          | Module | Line | Memory | Count |

          | :---- | ----: |----: | ----: |

          {% for snap in snapshot or [] -%}
            {%set abbr = snap.filename.split('/') %}   | {{ abbr[-2::] | join('/') }} | {{ snap.lineno }} | {{snap.size |  int}} | {{ snap.count }} | {{ '\n' }}
            {%- endfor %}
          {%- endif %}
  - type: grid
    cards:
      - type: heading
        heading_style: title
        heading: Objects
      - type: tile
        entity: switch.memspy_memspy_memory_scanning
        name: Memory Scanning
        show_entity_picture: false
        hide_state: false
        state_content: last_changed
        vertical: false
        features:
          - type: toggle
        features_position: bottom
      - type: tile
        entity: number.memspy_memspy_memory_scan_frequency
        name: Scan Period
        vertical: false
        features_position: bottom
      - type: markdown
        content: >-
          **Status** - As of {{
          time_since(states.sensor.memspy.last_updated) }} ago

          System running for {{ time_since(as_datetime(
          states('sensor.last_boot'))) }} 

          {% set ent = "sensor.memspy" %}

          Memory: **{{ '{:,.0f}'.format(state_attr(ent, "memory") |
          float)}}**

          Objects: **{{ '{:,.0f}'.format(state_attr(ent, "object_count") |
          float(0)) }}**

          Garbage: **{{ state_attr(ent, 'garbage')}}**

          Collections: **{{ state_attr(ent, 'collections')}}**

          Collected: **{{ '{:,.0f}'.format(state_attr(ent, 'collected') |
          float)}}**

          {% set stat = state_attr(ent, 'gc_stats') %}

          | Collections | Collected | Uncollected|

          |------:|----:|----:|

          {% for s in stat %}| **{{ '{:,.0f}'.format( s['collections'] |
          float)}}** |  **{{ '{:,.0f}'.format( s['collected'] | float )}}**
          | **{{ s['uncollectable']}}** |

          {% endfor %}
      - type: custom:auto-entities
        card:
          type: entities
        filter:
          include:
            - entity_id: sensor.memspy_class_*
              sort:
                reverse: true
                numeric: true
          exclude: []
        options:
          tap_action:
            action: more-info
header:
  card:
    type: markdown
    text_only: true
    content: '# MemSpy - Memory Diagnostics'
icon: mdi:incognito
cards: []
