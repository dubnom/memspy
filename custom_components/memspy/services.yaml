# Memory scanning is controlled by the frequency number and scanning switch entities.
install_dashboard:
  name: Install or Upgrade
  description: >-
    Add or refresh the MemSpy view on the dedicated MemSpy dashboard,
    bypassing the normal "already up to date" check. Returns a `result`
    field describing the outcome (added, updated, already_up_to_date,
    dashboard_not_storage_mode, lovelace_not_ready, lovelace_unavailable,
    view_file_missing, or save_failed).
