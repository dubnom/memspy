refresh:
  name: Refresh object sensors
  description: Action to collect the current object memory snapshot.

set_frequency:
  name: Set refresh frequency
  description: Action to set the automatic sensor refresh interval in seconds. Use zero to disable it.
  fields:
    frequency:
      name: Frequency
      description: Seconds between automatic refreshes.
      required: true
      selector:
        number:
          min: 0
          mode: box

snapshot_tracemalloc:
  name: Snapshot tracemalloc
  description: Capture the current tracemalloc snapshot and return the top-N entries based on the configured prolog_top_n value.
  response:
    optional: true
